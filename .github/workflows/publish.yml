name: Publish to Marketplaces

# 触发方式 / Triggers:
#   1. 打 tag（v0.1.0 / v0.2.0 …）自动发布
#   2. 在 Actions 页面手动点击 Run workflow
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none/major/minor/patch)'
        required: false
        default: 'none'
        type: choice
        options: [none, major, minor, patch]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets 不能直接用在 step 的 if 里，先提到 job 级 env
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          BUMP="${{ github.event.inputs.bump || 'none' }}"
          if [ "$BUMP" = "none" ]; then
            npx vsce publish -p "$VSCE_PAT"
          else
            npx vsce publish -p "$VSCE_PAT" "$BUMP"
          fi

      - name: Package VSIX
        run: npx vsce package --out ropide-vscode-plugin.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish ropide-vscode-plugin.vsix -p "$OVSX_PAT"

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ropide-vscode-plugin.vsix \
            --title "${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload "${{ github.ref_name }}" ropide-vscode-plugin.vsix --clobber
